name: flutter_godot_example
description: "Demonstrates how to use the flutter_godot plugin."
publish_to: "none"
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_godot:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/godot_game.pck
    - assets/bin/  # Bundled Godot binary (optional, run setup_godot_bundle.sh to add)
    - assets/godot_web/  # Godot WASM export for WebView approach
