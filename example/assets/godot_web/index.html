		<!-- WebSocket IPC Bridge: intercepts Godot console output and relays over WebSocket -->
		<script>
(function() {
	// Get WebSocket port from URL parameters (default: 5000)
	var params = new URLSearchParams(window.location.search);
	var wsPort = params.get('ws_port') || '5000';
	var wsUrl = 'ws://127.0.0.1:' + wsPort;

	// Initialize message queue for Flutter->Godot messages
	window._flutterMessages = [];
	window._godotReady = false;
	window._wsConnected = false;

	var ws = null;
	var reconnectTimer = null;

	function connectWebSocket() {
		try {
			ws = new WebSocket(wsUrl);

			ws.onopen = function() {
				console.log('[WS-Bridge] Connected to ' + wsUrl);
				window._wsConnected = true;
				// Notify Flutter that Godot WebView is connected
				ws.send(JSON.stringify({
					type: 'data',
					payload: 'WebSocket bridge connected',
					timestamp: Date.now()
				}));
			};

			ws.onmessage = function(event) {
				// Receive messages from Flutter and push to Godot's message queue
				try {
					var msg = JSON.parse(event.data);
					window._flutterMessages.push(msg);
					console.log('[WS-Bridge] Received from Flutter: ' + event.data);
				} catch (e) {
					// Not JSON, push as string
					window._flutterMessages.push({type: 'data', payload: event.data});
				}
			};

			ws.onclose = function(event) {
				console.log('[WS-Bridge] Disconnected (code=' + event.code + ')');
				window._wsConnected = false;
				// Reconnect after 2 seconds
				reconnectTimer = setTimeout(connectWebSocket, 2000);
			};

			ws.onerror = function(error) {
				console.log('[WS-Bridge] Connection error');
				window._wsConnected = false;
			};
		} catch (e) {
			console.log('[WS-Bridge] Failed to create WebSocket: ' + e);
			reconnectTimer = setTimeout(connectWebSocket, 2000);
		}
	}

	// Intercept console.log to capture Godot IPC messages
	var originalLog = console.log;
	console.log = function() {
		// Call original first
		originalLog.apply(console, arguments);

		// Check for __GODOT_IPC__ prefix in any argument
		for (var i = 0; i < arguments.length; i++) {
			var arg = String(arguments[i]);
			if (arg.indexOf('__GODOT_IPC__:') === 0) {
				var jsonStr = arg.substring('__GODOT_IPC__:'.length);
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(jsonStr);
				}
			}
		}

		// Mark Godot as ready when it signals
		if (arguments.length > 0 && String(arguments[0]).indexOf('[main.gd]') >= 0) {
			if (!window._godotReady) {
				window._godotReady = true;
			}
		}
	};

	// Start WebSocket connection
	connectWebSocket();

	// Expose send function for direct JavaScript calls
	window._sendToFlutter = function(data) {
		if (ws && ws.readyState === WebSocket.OPEN) {
			var msg = JSON.stringify({
				type: 'data',
				payload: data,
				timestamp: Date.now()
			});
			ws.send(msg);
		}
	};
})();
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9872,"index.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
